services:
  # Roteador / Load Balancer central da arquitetura
  proxy:
    image: nginx:alpine
    container_name: lab-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api-blue:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - lab-network

  # Backend Clojure - Versão 1 (Blue / Baseline)
  api-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-api-blue
    restart: always
    environment:
      - PORT=3000
      - APP_VERSION=v1.0.0
      - APP_COLOR=blue
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=app_pass
      - UNLEASH_URL=http://unleash:4242/api/client/features
      - UNLEASH_API_TOKEN=*:development.9fbd851f2c38b0c178f2ed2e06e409b3035342442a41eb373eb35e17
    depends_on:
      db:
        condition: service_healthy
    # O healthcheck usa a readiness probe: o container só é considerado
    # saudável depois que a aplicação conversa com o PostgreSQL.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - lab-network

  # Backend Clojure - Versão 2 (Green / Canary)
  api-green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-api-green
    restart: always
    environment:
      - PORT=3000
      - APP_VERSION=v2.0.0
      - APP_COLOR=green
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=app_pass
      - UNLEASH_URL=http://unleash:4242/api/client/features
      - UNLEASH_API_TOKEN=*:development.9fbd851f2c38b0c178f2ed2e06e409b3035342442a41eb373eb35e17
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - lab-network

  # Frontend React com Tailwind CSS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab-frontend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lab-network

  # Banco de Dados compartilhado PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: always
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/resources/db/migration.sql:/docker-entrypoint-initdb.d/migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - lab-network

volumes:
  postgres_data:

networks:
  lab-network:
    name: lab-network
