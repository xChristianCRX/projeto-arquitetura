

services:
  unleash:
    image: unleashorg/unleash-server:latest
    container_name: lab-unleash
    restart: always
    ports:
      - "4242:4242"
    environment:
      - DATABASE_URL=postgres://unleash_user:unleash_pass@unleash-db:5432/unleash
      - DATABASE_SSL=false
      # Segredos distintos: o Unleash usa o segredo como chave, então tokens
      # iguais criam um só (e ele nasce como 'frontend', que o endpoint
      # /api/client/features rejeita com 403). O ambiente também precisa
      # existir - esta versão tem 'development' e 'production', não 'default'.
      - INIT_FRONTEND_API_TOKENS=*:development.unleash-lab-frontend-token
      - INIT_CLIENT_API_TOKENS=*:development.9fbd851f2c38b0c178f2ed2e06e409b3035342442a41eb373eb35e17
    depends_on:
      - unleash-db
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - lab-network

  unleash-db:
    image: postgres:16-alpine
    container_name: lab-unleash-db
    restart: always
    environment:
      - POSTGRES_DB=unleash
      - POSTGRES_USER=unleash_user
      - POSTGRES_PASSWORD=unleash_pass
    volumes:
      - unleash_data:/var/lib/postgresql/data
    networks:
      - lab-network

volumes:
  unleash_data:

networks:
  lab-network:
    external: true
